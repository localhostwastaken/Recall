services:
  arkiv:
    image: ghcr.io/arkiv-network/arkiv-reth-dev:v1.0.1
    ports:
      - "8545:8545"
  # bee-compose (started by scripts/devnet-up.sh) publishes its second node on
  # :16331; this forwards it to the :1643 the app config expects.
  swarm-b:
    image: alpine/socat:1.8.0.1
    command: TCP-LISTEN:1643,fork,reuseaddr TCP:host.docker.internal:16331
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1643:1643"
  # TLS 1.2-only fixture website the witness captures; reachable on the
  # `recall` network as notice.recall.test:443 and on the host at :443.
  notice:
    build: ../fixtures/notice
    ports:
      - "443:443"
    volumes:
      - ../fixtures/notice/.certs:/app/.certs:ro
    networks:
      recall:
        aliases:
          - notice.recall.test
  # Recall witness (witness/, patched TLSNotary verifier) on :7047. Dev CA mode:
  # trusts ONLY the fixture CA, and /proxy may dial notice.recall.test at its
  # private Docker address. The key is Hardhat account #2: public and test-only
  # (DEVNET_WITNESS_KEY in e2e/fixtures/keys.ts). Never put a real key here.
  witness:
    build: ../witness
    ports:
      - "7047:7047"
    environment:
      WITNESS_PRIVATE_KEY: "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
      WITNESS_DEV_CA_DER: /certs/ca.der
      WITNESS_DEV_ALLOW_HOSTS: notice.recall.test
    volumes:
      - ../fixtures/notice/.certs:/certs:ro
    networks:
      - recall
    depends_on:
      - notice
networks:
  recall:
    name: recall
