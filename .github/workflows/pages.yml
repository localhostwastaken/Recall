name: pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First-party actions are pinned to full commit SHAs (the tag is the trailing comment).
      # pnpm comes from corepack, at the version in the root package.json "packageManager"
      # field; there is no third-party action in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          pnpm --version
      # Only the app and the workspace packages it uses.
      - run: pnpm install --frozen-lockfile --filter 'web...'
      # The app is served at /Recall/app/ here and at /bzz/<ref>/ on Swarm. Its asset URLs are
      # relative (vite base './') and it routes by hash, so neither host needs a rewrite rule.
      - name: Build the app with the live network config
        env:
          VITE_RECALL_NET: live
          # The Arkiv access key baked in as the app's default (R30). A repository secret;
          # vite.config.ts reads it at build time and it is never committed.
          ARKIV_ACCESS_KEY: ${{ secrets.ARKIV_ACCESS_KEY }}
        run: pnpm --filter web build
      # site/ holds the demo notice (/Recall/notice/); the app goes next to it (/Recall/app/).
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R apps/web/dist _site/app
          touch _site/.nojekyll
          test -f _site/notice/index.html
          test -f _site/app/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
